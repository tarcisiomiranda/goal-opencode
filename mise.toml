[tools]
bun = "1.3.11"

[tasks.install]
description = "Instala dependencias de dev"
run = "bun install"

[tasks.test]
description = "Testes unitarios"
run = "bun test"

[tasks.typecheck]
description = "Typecheck TypeScript"
run = "bun x tsc --noEmit"

[tasks.build]
description = "Gera dist/tui.js com o transform Solid"
run = "bun run scripts/build.ts"

[tasks.check]
description = "Typecheck + testes + build"
depends = ["typecheck", "test", "build"]
